# PURPOSE: the Quarto face of txtheme -- one custom HTML format carrying the theme and the code
#   colours, so a document says `format: txtheme-html` and nothing else.
# ROLE: hand-written. The .scss and .theme files beside it are GENERATED by txtheme::build_theme();
#   this file only names them.
#
# WARNING: `brand` appears in both theme lists on purpose, and it is a documented no-op when the
#   project has no _brand.yml. An extension CANNOT set `brand:` for its consumer -- that key is
#   resolved from project/document metadata, not from a format's render defaults -- so the brand
#   half is a file at the project root, which Quarto auto-discovers with no YAML at all.
#   `txtheme::use_brand()` puts inst/brand/_brand.yml there.
# WARNING: the LIGHT half is Quarto's own on purpose -- no colour in TX_PALETTE declares a `light`
#   value yet, so there is nothing to ship and `default` / `arrow-light` is the honest answer. The
#   day the light column is filled in, build_theme() writes txtheme-light.scss / .theme and these
#   two lines change; nothing else does.
title: txtheme
author: Brice Nocenti
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      theme:
        light: [brand, default]
        dark: [brand, txtheme-dark.scss]
      syntax-highlighting:
        light: arrow-light
        dark: txtheme-dark.theme
