# PURPOSE: the Quarto face of txtheme -- one custom HTML format carrying the theme, the code
#   colours, the course typography and the annotation classes, so a document says
#   `format: txtheme-html` and nothing else.
# ROLE: hand-written. Every .scss, .css and .theme file beside it is GENERATED by
#   txtheme::build_theme(); this file only names them.
#
# WARNING: `brand` appears in both theme lists on purpose, and it is a documented no-op when the
#   project has no _brand.yml. An extension CANNOT set `brand:` for its consumer -- that key is
#   resolved from project/document metadata, not from a format's render defaults -- so the brand
#   half is a file at the project root, which Quarto auto-discovers with no YAML at all.
#   `txtheme::use_brand()` puts inst/brand/_brand.yml there.
# WARNING: the typography and the annotations arrive as `css:`, not as theme layers, and that is
#   the difference that matters. Quarto compiles a WHOLE SEPARATE STYLESHEET per mode and swaps
#   them, so a theme layer exists once per mode; `css:` is loaded ONCE, for both. Neither of these
#   two files carries a colour that depends on the mode -- the typography carries none at all, and
#   the annotations decide the mode in their own cascade -- so `css:` is where they belong. A
#   `.scss` named in a theme list must also declare a layer boundary, which plain typography has no
#   use for.
title: txtheme
author: Brice Nocenti
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    html:
      theme:
        light: [brand, txtheme-light.scss]
        dark:  [brand, txtheme-dark.scss]
      syntax-highlighting:
        light: txtheme-light.theme
        dark:  txtheme-dark.theme
      css:
        - txtheme-prose.css
        - txtheme-annotations.css
