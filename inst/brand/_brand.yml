# GENERATED by txtheme::build_theme() from R/aaa-palette.R -- do not edit.
#
# The unified brand: one file, a light and a dark value per role. Copy it to a Quarto project's
# ROOT and write nothing -- `brand:` is auto-discovered from there. It must never sit under
# `format: html:`; nested there it is silently ignored, the two stylesheets come out identical,
# and none of these colours appear.
#
# Only the dark half of the palette is decided, so only `dark:` is written under each role.
# That is safe, not a compromise: measured on Quarto 1.10.18, a role names a mode or is ignored
# in it -- `background: {dark: page}` leaves the light stylesheet on #ffffff.
#
# WARNING: the palette's NAMES share a namespace with the roles. An entry named after a role
#   (link, primary, danger, ...) is promoted to that role in BOTH modes, silently -- which is
#   why the blue below is `accent` and not `link`. txtheme refuses such a name at load.
#
# The palette also reaches BOTH stylesheets as `--brand-<name>` custom properties, so a document
# can use any of these colours by name without a hex leaving txtheme.
meta:
  name: txtheme
color:
  palette:
    page: "#21252b"
    panel: "#282c34"
    ink: "#CDCBBC"
    emphasis: "#fcfcfa"
    border: "#3e4451"
