<!-- PURPOSE: what txtheme adds to a consumer's <head>, so the consumer's _pkgdown.yml stays one line.
     ROLE: shadows pkgdown's own in-header.html, whose single line is kept BELOW. pkgdown searches
       the site's own pkgdown/templates/ first, then this package's, then its own -- so a site can
       always shadow this back, and must then carry pkgdown's line itself.
     Two OPT-IN assets, each `template: params: {txtheme: {<name>: true}}`:
       annotations  the twelve pandoc-span classes. Opt-in because pkgdown itself styles
                    `pre code .error` / `.warning`, and a reference page really does emit
                    <span class="warning"> for an example's warning.
       prose        the course typography -- heading family and scale, paragraph rhythm, the two
                    prose classes. Opt-in because a paragraph rhythm is a COURSE's voice, and a
                    reference site may not want it. A Quarto document gets it unconditionally.
     WARNING: the last line is pkgdown's, not ours. Dropping it silently kills
       `template: includes: in_header:` for every site using txtheme. -->
<script src="{{#site}}{{root}}{{/site}}txtheme-at.js" defer></script>
{{#yaml}}{{#txtheme}}{{#annotations}}<link href="{{#site}}{{root}}{{/site}}txtheme-annotations.css" rel="stylesheet">{{/annotations}}{{#prose}}<link href="{{#site}}{{root}}{{/site}}txtheme-prose.css" rel="stylesheet">{{/prose}}{{/txtheme}}{{/yaml}}
{{#includes}}{{{in_header}}}{{/includes}}
